@if (kind() === 'paris') {
  <svg
    class="earth-cityscape"
    data-cityscape-svg="paris"
    data-cityscape-light-density="dense"
    [attr.viewBox]="panoramaProjection().viewBox"
    preserveAspectRatio="none"
    focusable="false"
    aria-hidden="true"
  >
    <defs>
      <linearGradient id="paris-far-buildings" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#273344" />
        <stop offset="1" stop-color="#090d14" />
      </linearGradient>
      <linearGradient id="paris-near-buildings" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#151d29" />
        <stop offset="0.72" stop-color="#070a10" />
        <stop offset="1" stop-color="#010207" />
      </linearGradient>
      <radialGradient id="paris-dome-light" cx="50%" cy="55%" r="60%">
        <stop offset="0" stop-color="#e9c88a" stop-opacity="0.5" />
        <stop offset="1" stop-color="#c39044" stop-opacity="0" />
      </radialGradient>
      <radialGradient id="paris-urban-light-pool" cx="50%" cy="50%" r="50%">
        <stop class="earth-cityscape__light-pool-core" offset="0" />
        <stop class="earth-cityscape__light-pool-mid" offset="0.42" />
        <stop class="earth-cityscape__light-pool-edge" offset="1" />
      </radialGradient>
      <filter id="paris-window-glow" x="-120%" y="-120%" width="340%" height="340%">
        <feGaussianBlur stdDeviation="1.4" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <g id="paris-panorama">
        <g transform="scale(3 1)">
          <path
            class="earth-cityscape__far"
            fill="url(#paris-far-buildings)"
            [attr.d]="parisFarSilhouettePath"
          />
        </g>

        <g class="earth-cityscape__light-pools" data-city-light-pools="">
          @for (pool of parisLightPools; track pool.id) {
            <ellipse
              data-city-light-pool=""
              fill="url(#paris-urban-light-pool)"
              [attr.cx]="pool.x"
              [attr.cy]="pool.y"
              [attr.rx]="pool.radiusX"
              [attr.ry]="pool.radiusY"
              [attr.opacity]="pool.opacity"
            />
          }
        </g>

        @for (landmark of parisLandmarkLayouts(); track landmark.id) {
          @if (showIllustrativeTerrain() && landmark.terrainPath) {
            <path class="earth-cityscape__montmartre" [attr.d]="landmark.terrainPath" />
          }
          <svg
            [attr.class]="'earth-cityscape__licensed-landmark ' + landmark.className"
            [attr.data-landmark-id]="landmark.id"
            [attr.data-height-meters]="landmark.heightMeters"
            [attr.data-base-elevation-meters]="landmark.baseElevationMeters"
            [attr.x]="landmark.x"
            [attr.y]="landmark.y"
            [attr.width]="landmark.width"
            [attr.height]="landmark.height"
            [attr.viewBox]="landmark.sourceViewBox"
            preserveAspectRatio="xMidYMax meet"
          >
            <use [attr.href]="landmark.sourceHref" />
          </svg>
        }

        <g transform="scale(3 1)">
          <path
            class="earth-cityscape__near"
            fill="url(#paris-near-buildings)"
            [attr.d]="parisNearSilhouettePath"
          />
        </g>

        <g class="earth-cityscape__windows" filter="url(#paris-window-glow)">
          @for (light of parisWindowLights; track light.id) {
            <rect
              data-city-light=""
              [attr.x]="light.x"
              [attr.y]="light.y"
              [attr.width]="light.width"
              [attr.height]="light.height"
              [attr.rx]="light.height / 2"
              [attr.opacity]="light.opacity"
            />
          }
        </g>
      </g>
    </defs>

    <use href="#paris-panorama" x="0" />
    <use href="#paris-panorama" x="7200" />
    <use href="#paris-panorama" x="14400" />
  </svg>
} @else if (regionalCityscape(); as cityscape) {
  <svg
    class="earth-cityscape earth-cityscape--regional"
    [attr.data-cityscape-svg]="cityscape.kind"
    [attr.data-cityscape-architecture]="cityscape.kind"
    [attr.data-cityscape-light-density]="cityscape.lightDensity"
    [attr.viewBox]="panoramaProjection().viewBox"
    preserveAspectRatio="none"
    focusable="false"
    aria-hidden="true"
  >
    <defs>
      <linearGradient id="regional-terrain" x1="0" y1="0" x2="0" y2="1">
        <stop class="earth-cityscape__terrain-stop" offset="0" />
        <stop class="earth-cityscape__terrain-base-stop" offset="1" />
      </linearGradient>
      <linearGradient id="regional-far-buildings" x1="0" y1="0" x2="0" y2="1">
        <stop class="earth-cityscape__far-stop" offset="0" />
        <stop class="earth-cityscape__far-base-stop" offset="1" />
      </linearGradient>
      <linearGradient id="regional-near-buildings" x1="0" y1="0" x2="0" y2="1">
        <stop class="earth-cityscape__near-stop" offset="0" />
        <stop class="earth-cityscape__near-base-stop" offset="1" />
      </linearGradient>
      <radialGradient id="regional-urban-light-pool" cx="50%" cy="50%" r="50%">
        <stop class="earth-cityscape__light-pool-core" offset="0" />
        <stop class="earth-cityscape__light-pool-mid" offset="0.42" />
        <stop class="earth-cityscape__light-pool-edge" offset="1" />
      </radialGradient>
      <filter id="regional-window-glow" x="-120%" y="-120%" width="340%" height="340%">
        <feGaussianBlur stdDeviation="1.55" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <g id="regional-panorama">
        @if (showIllustrativeTerrain() && cityscape.terrainPath) {
          <path
            class="earth-cityscape__terrain"
            fill="url(#regional-terrain)"
            [attr.d]="cityscape.terrainPath"
          />
        }
        <path
          class="earth-cityscape__far"
          fill="url(#regional-far-buildings)"
          [attr.d]="cityscape.farSilhouettePath"
        />

        <g class="earth-cityscape__light-pools" data-city-light-pools="">
          @for (pool of cityscape.lightPools; track pool.id) {
            <ellipse
              data-city-light-pool=""
              fill="url(#regional-urban-light-pool)"
              [attr.cx]="pool.x"
              [attr.cy]="pool.y"
              [attr.rx]="pool.radiusX"
              [attr.ry]="pool.radiusY"
              [attr.opacity]="pool.opacity"
            />
          }
        </g>

        @for (landmark of regionalLandmarkLayouts(); track landmark.id) {
          <svg
            class="earth-cityscape__regional-landmark"
            data-regional-landmark=""
            [attr.data-landmark-id]="landmark.id"
            [attr.data-landmark-name]="landmark.name"
            [attr.data-bearing-degrees]="landmark.bearingDegrees"
            [attr.data-height-meters]="landmark.heightMeters"
            [attr.data-source-url]="landmark.sourceUrl"
            [attr.x]="landmark.x"
            [attr.y]="landmark.y"
            [attr.width]="landmark.width"
            [attr.height]="landmark.height"
            [attr.viewBox]="landmark.sourceViewBox"
            preserveAspectRatio="xMidYMax meet"
          >
            <path
              class="earth-cityscape__landmark-silhouette"
              fill="#050a11"
              fill-rule="nonzero"
              stroke="#6f879b"
              stroke-opacity="0.54"
              stroke-width="1.2"
              vector-effect="non-scaling-stroke"
              [attr.d]="landmark.silhouettePath"
            />
          </svg>
        }

        <path
          class="earth-cityscape__near"
          fill="url(#regional-near-buildings)"
          [attr.d]="cityscape.nearSilhouettePath"
        />

        <g class="earth-cityscape__windows" filter="url(#regional-window-glow)">
          @for (light of cityscape.windowLights; track light.id) {
            <rect
              data-city-light=""
              [attr.x]="light.x"
              [attr.y]="light.y"
              [attr.width]="light.width"
              [attr.height]="light.height"
              [attr.rx]="light.height / 2"
              [attr.opacity]="light.opacity"
            />
          }
        </g>
      </g>
    </defs>

    <use href="#regional-panorama" x="0" />
    <use href="#regional-panorama" x="7200" />
    <use href="#regional-panorama" x="14400" />
  </svg>
} @else if (catalogLandmarkLayouts().length > 0) {
  <svg
    class="earth-cityscape earth-cityscape--catalog"
    data-cityscape-svg="catalog"
    data-art-direction="unique-city-panorama"
    [attr.data-location-id]="location()?.id"
    [attr.data-cityscape-architecture]="catalogCityscape()?.architecture"
    [attr.data-cityscape-terrain]="catalogCityscape()?.terrain"
    [attr.data-cityscape-light-density]="catalogCityscape()?.lightDensity"
    [attr.viewBox]="panoramaProjection().viewBox"
    preserveAspectRatio="none"
    focusable="false"
    aria-hidden="true"
  >
    <defs>
      <linearGradient id="catalog-terrain" x1="0" y1="0" x2="0" y2="1">
        <stop class="earth-cityscape__terrain-stop" offset="0" />
        <stop class="earth-cityscape__terrain-base-stop" offset="1" />
      </linearGradient>
      <linearGradient id="catalog-far-buildings" x1="0" y1="0" x2="0" y2="1">
        <stop class="earth-cityscape__far-stop" offset="0" />
        <stop class="earth-cityscape__far-base-stop" offset="1" />
      </linearGradient>
      <linearGradient id="catalog-near-buildings" x1="0" y1="0" x2="0" y2="1">
        <stop class="earth-cityscape__near-stop" offset="0" />
        <stop class="earth-cityscape__near-base-stop" offset="1" />
      </linearGradient>
      <radialGradient id="catalog-urban-light-pool" cx="50%" cy="50%" r="50%">
        <stop class="earth-cityscape__light-pool-core" offset="0" />
        <stop class="earth-cityscape__light-pool-mid" offset="0.42" />
        <stop class="earth-cityscape__light-pool-edge" offset="1" />
      </radialGradient>
      <filter id="catalog-window-glow" x="-120%" y="-120%" width="340%" height="340%">
        <feGaussianBlur stdDeviation="1.5" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <g id="catalog-landmark-panorama">
        @if (catalogCityscape(); as cityscape) {
          @if (showIllustrativeTerrain()) {
            <path
              class="earth-cityscape__terrain"
              fill="url(#catalog-terrain)"
              [attr.d]="cityscape.terrainPath"
            />
          }
          <path
            class="earth-cityscape__far"
            fill="url(#catalog-far-buildings)"
            [attr.d]="cityscape.farSilhouettePath"
          />

          <g class="earth-cityscape__light-pools" data-city-light-pools="">
            @for (pool of cityscape.lightPools; track pool.id) {
              <ellipse
                data-city-light-pool=""
                fill="url(#catalog-urban-light-pool)"
                [attr.cx]="pool.x"
                [attr.cy]="pool.y"
                [attr.rx]="pool.radiusX"
                [attr.ry]="pool.radiusY"
                [attr.opacity]="pool.opacity"
              />
            }
          </g>
        }

        @for (landmark of catalogLandmarkLayouts(); track landmark.id) {
          <svg
            class="earth-cityscape__catalog-landmark"
            data-catalog-landmark=""
            [attr.data-landmark-id]="landmark.id"
            [attr.data-landmark-name]="landmark.name"
            [attr.data-bearing-degrees]="landmark.bearingDegrees"
            [attr.data-height-meters]="landmark.heightMeters"
            [attr.data-height-confidence]="landmark.heightConfidence"
            [attr.data-scientific-confidence]="landmark.scientificConfidence"
            [attr.data-visual-confidence]="landmark.visualConfidence"
            [attr.data-selection-method]="landmark.selectionMethod"
            [attr.data-source-title]="landmark.sourceTitle"
            [attr.data-source-url]="landmark.sourceUrl"
            [attr.x]="landmark.x"
            [attr.y]="landmark.y"
            [attr.width]="landmark.width"
            [attr.height]="landmark.height"
            [attr.viewBox]="landmark.sourceViewBox"
            preserveAspectRatio="xMidYMax meet"
          >
            <path
              class="earth-cityscape__landmark-silhouette"
              fill="#050a11"
              fill-rule="nonzero"
              stroke="#6f879b"
              stroke-opacity="0.54"
              stroke-width="1.2"
              vector-effect="non-scaling-stroke"
              [attr.d]="landmark.silhouettePath"
            />
          </svg>
        }

        @if (catalogCityscape(); as cityscape) {
          <path
            class="earth-cityscape__near"
            fill="url(#catalog-near-buildings)"
            [attr.d]="cityscape.nearSilhouettePath"
          />

          <g class="earth-cityscape__windows" filter="url(#catalog-window-glow)">
            @for (light of cityscape.windowLights; track light.id) {
              <rect
                data-city-light=""
                [attr.x]="light.x"
                [attr.y]="light.y"
                [attr.width]="light.width"
                [attr.height]="light.height"
                [attr.rx]="light.height / 2"
                [attr.opacity]="light.opacity"
              />
            }
          </g>
        }
      </g>
    </defs>

    <use href="#catalog-landmark-panorama" x="0" />
    <use href="#catalog-landmark-panorama" x="7200" />
    <use href="#catalog-landmark-panorama" x="14400" />
  </svg>
}
